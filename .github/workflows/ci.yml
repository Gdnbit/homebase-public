name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: Frontend (TypeScript + Vite)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check frontend and CLI contracts
        run: |
          npm run lint
          npm run control:check
          npm run test:control:contract

      - name: Test Pi runtime
        run: |
          npm ci --prefix agent-runtime --ignore-scripts --no-audit --no-fund
          npm test --prefix agent-runtime

      - name: Build frontend (Vite)
        run: npm run build

      - name: Test synthetic desktop workflows
        run: npm run test:control:ui -- ai-first.spec.ts performance.spec.ts preflight.spec.ts entry.spec.ts expiry-indicator.spec.ts updates.spec.ts

      - name: Test isolated attachments, handoff and capability provisioning
        run: node --test scripts/test-workflow-handoff.mjs scripts/test-repo-capabilities.mjs scripts/test-repo-capability-evidence.mjs

  rust-backend:
    name: Rust Backend (Tauri 2)
    runs-on: windows-latest
    # Leave time for a cold build, the full suite, and the post-job Cargo cache save.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node.js 22 (for Tauri build hooks)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend deps (needed for tauri-build)
        run: npm ci

      - name: Install the Pi runtime for native tests
        run: npm ci --prefix agent-runtime --ignore-scripts --no-audit --no-fund

      - name: Build frontend for Tauri
        run: npm run build

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check (advisory)
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features

      - name: cargo check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets

      - name: cargo test
        run: |
          $testProfile = Join-Path $env:RUNNER_TEMP ('homebase-test-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $testProfile | Out-Null
          $env:HOMEBASE_TEST_HOME = $testProfile
          $env:TMP = $testProfile
          $env:TEMP = $testProfile
          $env:TMPDIR = $testProfile
          $env:SystemTemp = $testProfile
          cargo test --locked --manifest-path src-tauri/Cargo.toml --all-features -- --test-threads=1

  tauri-build:
    name: Tauri source-only build (smoke)
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [frontend, rust-backend]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-tauri-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Tauri build
        run: npm run tauri:build -- --no-bundle -- --locked

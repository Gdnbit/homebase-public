[package]
name = "homebase-control-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fs2 = "0.4"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
chrono = "0.4"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
png = "=0.17.16"
zeroize = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
aes = "0.8"
ecb = { version = "0.1", features = ["alloc"] }
md-5 = "0.10"
zip = { version = "=2.4.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_Storage_FileSystem"] }

[profile.dev]
debug = 0
[profile.test]
debug = 0

[package]
name = "homebase-secret-lifecycle-tests"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "homebase-reveal-isolated"
path = "../../src-tauri/src/bin/reveal.rs"

[dependencies]
async-trait = "0.1"
regex = "1"
fs2 = "0.4"
sha2 = "0.10"
tempfile = "3"
zeroize = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "1"
dirs = "5"
tracing = "0.1"

[profile.dev]
debug = 0

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.test]
debug = 0
